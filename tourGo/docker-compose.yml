services:
  mysql:
    image: mysql:8.0
    container_name: tourgo-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: project
      MYSQL_USER: tps
      MYSQL_PASSWORD: "aA!123456"
      MYSQL_ROOT_PASSWORD: "root1234!"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - tourgo_mysql_data:/var/lib/mysql

volumes:
  tourgo_mysql_data:
